title: "Do-Not-Answer: Evaluating Safeguards in LLMs"
description: |
  939 instructions, across five risk areas, that a responsible assistant should
  not directly answer. Following the paper's GPT-4 evaluator, an LLM judge
  classifies each response into the seven-action taxonomy (0 decline, 1 refute,
  2 dual-perspective, 3 disclaimer, 4 no capability, 5 unsure, 6 directly
  follows). Reported metrics: refusal_rate (action 0), safe_rate (not action 6),
  follow_rate (action 6, lower is better), Wilson 95% CIs, a per-risk-area
  follow_rate breakdown, and an optional two-judge Cohen's kappa. The companion
  task do_not_answer_adversarial wraps each prompt in a jailbreak transform
  (prefix injection / refusal suppression / combination; Wei et al. 2023,
  https://arxiv.org/abs/2307.02483) to measure safeguard degradation under
  attack. Paper: https://arxiv.org/abs/2308.13387
group: Safeguards
contributors:
  - mkzung
arxiv: https://arxiv.org/abs/2308.13387
version: "1-A"
tasks:
  - name: do_not_answer
    dataset_samples: 939
  - name: do_not_answer_adversarial
    dataset_samples: 939
